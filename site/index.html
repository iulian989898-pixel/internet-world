<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Internet World — Test conexiune</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;background:radial-gradient(circle at 50% 15%,#263a43,#0c1015 65%);color:#f1f4f5;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);border:1px solid #334149;border-radius:24px;padding:40px 28px;background:#172027cc;text-align:center;box-shadow:0 22px 80px #0005}
    .orb{font-size:3.1rem;margin-bottom:15px}
    h1{font-size:clamp(1.8rem,6vw,2.5rem);letter-spacing:-.04em;margin:0 0 12px}
    p{color:#b7c6cb;line-height:1.6;margin:10px 0}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:10px 16px;background:#1b3933;border:1px solid #3b7567;color:#b6eedc;border-radius:999px;font-weight:600;font-size:.9rem}
    .dot{width:9px;height:9px;border-radius:50%;background:#79e1b7}
    small{display:block;margin-top:26px;color:#82969d}
  </style>
</head>
<body>
  <main>
    <div class="orb">🌍</div>
    <h1>Internet World</h1>
    <p>Prima pagină de test a proiectului.</p>
    <p>GitHub este pregătit pentru publicarea automată prin Netlify. Macheta site-ului va fi construită ulterior.</p>
    <div class="status"><span class="dot"></span> Test de conectare</div>
    <small>Acesta nu este încă site-ul final.</small>
  </main>
</body>
</html>
